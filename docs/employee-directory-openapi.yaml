openapi: 3.1.0
info:
  title: Employee Directory Time-Off Contract
  version: 1.1.0
paths:
  /api/v1/time-off-directory/employees:
    get:
      summary: Return the minimal employee projection required by the Ferie portal
      security:
        - oauth2: [read:time-off-directory]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Paginated employee projection
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  nextCursor: { type: [string, "null"] }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TimeOffEmployee" }
  /api/v1/time-off-directory/employees/{id}/preferred-language:
    patch:
      summary: Record an employee's preferred interface language
      description: >
        The only field the Ferie portal writes back. Employee Directory remains authoritative: the
        portal saves the change here first and mirrors it locally only once this call succeeds.
      security:
        - oauth2: [write:time-off-directory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preferredLanguage]
              properties:
                preferredLanguage: { $ref: "#/components/schemas/Language" }
      responses:
        "200":
          description: The stored preference
          content:
            application/json:
              schema:
                type: object
                required: [preferredLanguage]
                properties:
                  preferredLanguage: { $ref: "#/components/schemas/Language" }
        "404": { description: No such employee }
  /api/v1/time-off-directory/roles:
    get:
      summary: Return application-role definitions and current Auth0 synchronization state
      security:
        - oauth2: [read:time-off-directory]
      responses:
        "200": { description: Application roles and synchronization state }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://AUTH0_DOMAIN/oauth/token
          scopes:
            read:time-off-directory: Read the minimal time-off directory projection
            write:time-off-directory: Record an employee's preferred interface language
  schemas:
    Language:
      type: string
      enum: [IT, EN]
    WorkInterval:
      type: object
      additionalProperties: false
      required: [weekday, start, end]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7 }
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    TimeOffEmployee:
      type: object
      additionalProperties: false
      required: [id, employeeNumber, auth0Subject, workEmail, displayName, department, status, fte, schedule, roles, preferredLanguage, approvers, isDirector, directorMailDelegate, updatedAt]
      properties:
        id: { type: string }
        employeeNumber: { type: string }
        auth0Subject: { type: string }
        workEmail: { type: string, format: email }
        displayName: { type: string }
        title: { type: [string, "null"] }
        department:
          type: object
          required: [id, name, updatedAt]
          properties:
            id: { type: string }
            name: { type: string }
            updatedAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        fte: { type: number, exclusiveMinimum: 0 }
        schedule: { type: array, items: { $ref: "#/components/schemas/WorkInterval" } }
        roles: { type: array, items: { type: string, enum: [FERIE_FINAL_APPROVER, FERIE_PORTAL_ADMIN, STAFF_IT] } }
        preferredLanguage: { $ref: "#/components/schemas/Language" }
        approvers:
          type: array
          items:
            type: object
            required: [employeeSourceId, role]
            properties:
              employeeSourceId: { type: string }
              role: { type: string, enum: [PRE_APPROVER, RESPONSABILE, SUBSTITUTE_RESPONSABILE] }
        isDirector:
          type: boolean
          description: >
            True on exactly the employee currently holding the director role (at most one ACTIVE
            employee). Derived from the existing director role in ED, not separately editable. The
            portal must never send an email to this person.
        directorMailDelegate:
          type: [object, "null"]
          required: [employeeSourceId]
          properties:
            employeeSourceId:
              type: string
              description: >
                The delegate's ED employee id — the same id space as `approvers[].employeeSourceId`
                — so the portal resolves the delegate's current work email from its own mirror at
                delivery time. Referencing by id, not email, keeps a later address change from
                silently splitting the two systems.
          description: >
            Reference to the employee who receives the director's portal notifications. Non-null
            only when isDirector is true and a delegate is configured; always null on every other
            employee. ED clears the delegation whenever the director role leaves the person, so a
            former director can never keep a delegate. ED does not re-null the field if the delegate
            later becomes INACTIVE — it warns its operators instead — so the portal must fail safe
            at delivery time: suppress the director's mail whenever the delegate is missing or
            inactive in its mirror.
        updatedAt: { type: string, format: date-time }
